# Déploiement complet DLNUF en une seule commande : docker compose up -d --build
# Une seule instance PostgreSQL est partagée ; chaque service utilise son
# propre schéma PostgreSQL (paramètre ?schema= de DATABASE_URL).

services:
  # Base de données commune. Les données persistent dans le volume pgdata.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dlnuf
      POSTGRES_PASSWORD: dlnuf
      POSTGRES_DB: dlnuf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlnuf -d dlnuf"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Registre état-civil (couche 1, port 3001). Démarre seulement quand PostgreSQL est prêt.
  registre-etat-civil:
    build: ./backend/registres/etat-civil
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://dlnuf:dlnuf@postgres:5432/dlnuf?schema=etat_civil
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Registre justice (couche 1, port 3002) : casier judiciaire et nationalité.
  registre-justice:
    build: ./backend/registres/justice
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://dlnuf:dlnuf@postgres:5432/dlnuf?schema=justice
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  # Registre fiscal (couche 1, port 3003) : IFU et situation fiscale.
  registre-fiscal:
    build: ./backend/registres/fiscal
    restart: unless-stopped
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://dlnuf:dlnuf@postgres:5432/dlnuf?schema=fiscal
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  # Journal de traçabilité (couche 4, port 3006). Vérifie les jetons des citoyens
  # avec JWT_SECRET (à définir dans un fichier .env à la racine pour la production).
  journal:
    build: ./backend/journal
    restart: unless-stopped
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://dlnuf:dlnuf@postgres:5432/dlnuf?schema=journal
      JWT_SECRET: ${JWT_SECRET:-dlnuf-dev-secret-a-changer}
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy

  # Consentement & minimisation (couche 3, port 3005). Les SMS sont simulés dans ses logs.
  consentement:
    build: ./backend/consentement
    restart: unless-stopped
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://dlnuf:dlnuf@postgres:5432/dlnuf?schema=consentement
      JWT_SECRET: ${JWT_SECRET:-dlnuf-dev-secret-a-changer}
      RAPPELS_INTERVALLE_MINUTES: 15
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy

  # Passerelle d'échange (couche 2, port 3004). Les registres sont décrits dans le
  # catalogue (backend/passerelle/config/catalogue-registres.yaml) : brancher un autre
  # registre se fait là, et les adresses restent surchargeables par REGISTRE_*_URL.
  passerelle:
    build: ./backend/passerelle
    restart: unless-stopped
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://dlnuf:dlnuf@postgres:5432/dlnuf?schema=passerelle
      JWT_SECRET: ${JWT_SECRET:-dlnuf-dev-secret-a-changer}
      REGISTRE_ETAT_CIVIL_URL: ${REGISTRE_ETAT_CIVIL_URL:-http://registre-etat-civil:3001/api}
      REGISTRE_JUSTICE_URL: ${REGISTRE_JUSTICE_URL:-http://registre-justice:3002/api}
      REGISTRE_FISCAL_URL: ${REGISTRE_FISCAL_URL:-http://registre-fiscal:3003/api}
      CONSENTEMENT_URL: http://consentement:3005/api
      JOURNAL_URL: http://journal:3006/api
      BFF_URL: http://espace-usager:3000/api
      CLE_SERVICE_INTERNE: ${CLE_SERVICE_INTERNE:-dlnuf-cle-interne-a-changer}
      SONDE_INTERVALLE_MS: ${SONDE_INTERVALLE_MS:-5000}
      # Dossier du dictionnaire et du catalogue des registres (défaut : celui monté ci-dessous).
      CATALOGUE_DOSSIER: ${CATALOGUE_DOSSIER:-/app/config}
    # Dictionnaire et catalogue des registres : modifiables sans reconstruire l'image
    # (docker compose restart passerelle après modification).
    volumes:
      - ./backend/passerelle/config:/app/config:ro
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      registre-etat-civil:
        condition: service_started
      registre-justice:
        condition: service_started
      registre-fiscal:
        condition: service_started
      consentement:
        condition: service_started
      journal:
        condition: service_started

  # BFF espace usager (couche 5, port 3000) : SEUL service appelé par le frontend.
  espace-usager:
    build: ./backend/espace-usager
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://dlnuf:dlnuf@postgres:5432/dlnuf?schema=espace_usager
      JWT_SECRET: ${JWT_SECRET:-dlnuf-dev-secret-a-changer}
      JWT_DUREE: 8h
      CLE_SERVICE_INTERNE: ${CLE_SERVICE_INTERNE:-dlnuf-cle-interne-a-changer}
      PASSERELLE_URL: http://passerelle:3004/api
      CONSENTEMENT_URL: http://consentement:3005/api
      JOURNAL_URL: http://journal:3006/api
      CORS_ORIGINES: ${CORS_ORIGINES:-*}
      INTERFACE_TEST_ACTIVE: ${INTERFACE_TEST_ACTIVE:-true}
      # Reprise automatique des demandes en attente d'un registre ou d'une donnée à numériser.
      REPRISE_INTERVALLE_MS: ${REPRISE_INTERVALLE_MS:-10000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      passerelle:
        condition: service_started
      consentement:
        condition: service_started
      journal:
        condition: service_started

  # Frontend (espace usager et interface de test), servi par nginx sur http://localhost:3020
  # (port 3020 plutôt que 8080, souvent déjà occupé par Tomcat ou d'autres outils).
  # Le navigateur appelle uniquement le BFF (http://localhost:3000/api).
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3020:80"
    depends_on:
      espace-usager:
        condition: service_started

  # Documentation interactive des 7 contrats OpenAPI (Swagger UI) : http://localhost:3010
  # (port 3010 plutôt que 8080, souvent déjà occupé par Tomcat ou d'autres outils).
  # Lit directement les fichiers de docs/ (montés en lecture seule) : toujours à jour.
  documentation:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    environment:
      URLS: >-
        [
          {"url": "contrats/openapi-espace-usager.yaml", "name": "Espace usager BFF (port 3000)"},
          {"url": "contrats/openapi-passerelle.yaml", "name": "Passerelle (port 3004)"},
          {"url": "contrats/openapi-consentement.yaml", "name": "Consentement & minimisation (port 3005)"},
          {"url": "contrats/openapi-journal.yaml", "name": "Journal (port 3006)"},
          {"url": "contrats/openapi-registre-etat-civil.yaml", "name": "Registre état-civil (port 3001)"},
          {"url": "contrats/openapi-registre-justice.yaml", "name": "Registre justice (port 3002)"},
          {"url": "contrats/openapi-registre-fiscal.yaml", "name": "Registre fiscal (port 3003)"}
        ]
      URLS_PRIMARY_NAME: "Espace usager BFF (port 3000)"
    volumes:
      - ./docs:/usr/share/nginx/html/contrats:ro
    ports:
      - "3010:8080"

volumes:
  pgdata:
