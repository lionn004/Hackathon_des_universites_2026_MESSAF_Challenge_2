server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location / {
    try_files $uri $uri/ =404;
  }

  # Démo : toujours servir la dernière version des pages et scripts.
  location ~* \.(html|js|css)$ {
    add_header Cache-Control "no-cache";
  }
}
