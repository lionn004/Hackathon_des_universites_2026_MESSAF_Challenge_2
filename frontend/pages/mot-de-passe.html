<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié | e-FASO</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gris-50);
      padding: var(--space-4);
    }
    .auth-card {
      background: var(--blanc);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--space-10);
      width: 100%;
      max-width: 440px;
      position: relative;
      overflow: hidden;
      padding-top: calc(var(--space-10) + 4px);
    }
    .auth-logo { text-align: center; margin-bottom: var(--space-6); }
    .auth-logo h1 { font-size: var(--font-size-3xl); color: var(--vert); font-weight: 800; }
    .auth-logo .star { color: var(--or); font-size: 1.5em; }
    .auth-logo p { color: var(--gris-500); font-size: var(--font-size-sm); margin-top: var(--space-2); }
    .flag-banner {
      height: 4px;
      background: linear-gradient(90deg, var(--vert) 33%, var(--rouge) 33% 66%, var(--or) 66%);
      position: absolute; top: 0; left: 0; right: 0;
    }
    #alert { margin-bottom: var(--space-4); }

    /* Indicateur d'étape : une barre par étape, verte jusqu'à l'étape en cours. */
    .steps { margin-bottom: var(--space-6); }
    .steps-bars { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
    .steps-bars span { flex: 1; height: 4px; border-radius: 2px; background: var(--gris-200); }
    .steps-bars span.done { background: var(--vert); }
    .steps-label { font-size: var(--font-size-sm); color: var(--gris-600); }
    .steps-label strong { color: var(--gris-800); }

    .code-input { font-size: var(--font-size-xl); letter-spacing: 0.5em; text-align: center; }
    .resend { font-size: var(--font-size-sm); color: var(--gris-500); text-align: center; margin-top: var(--space-4); }
    .link-button {
      background: none; border: none; padding: 0; font: inherit;
      color: var(--vert); text-decoration: underline; cursor: pointer;
    }
    .link-button:disabled { color: var(--gris-400); text-decoration: none; cursor: default; }
  </style>
</head>
<body>
  <!-- Couche 5, espace usager : récupération du mot de passe par code SMS, en 3 étapes sur une seule page. -->
  <div class="auth-page">
    <div class="auth-card">
      <div class="flag-banner"></div>
      <div class="auth-logo">
        <h1>e<span class="star">★</span>FASO</h1>
        <p>Récupérer l'accès à votre compte</p>
      </div>

      <div class="steps">
        <div class="steps-bars" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="steps-label" id="stepsLabel" aria-live="polite"></div>
      </div>

      <div id="alert" class="alert hidden" role="alert"></div>

      <!-- Étape 1 : IUE et téléphone, envoi du code SMS -->
      <form id="step1" novalidate>
        <div class="form-group">
          <label class="form-label" for="iue">IUE (12 chiffres)</label>
          <input type="text" id="iue" class="form-input" placeholder="784302956148" maxlength="12" inputmode="numeric" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="telephone">Téléphone associé au compte</label>
          <div class="phone-input-group">
            <span class="phone-prefix">+226</span>
            <input type="tel" id="telephone" class="form-input" placeholder="70 12 34 56" autocomplete="tel-national" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn1">Recevoir un code par SMS</button>
      </form>

      <!-- Étape 2 : code SMS. Il n'est vérifié par le BFF qu'à l'étape 3, avec le nouveau mot de passe. -->
      <form id="step2" class="hidden" novalidate>
        <p style="font-size:var(--font-size-sm);color:var(--gris-600);margin-bottom:var(--space-4)">
          Si ces informations correspondent à un compte, un code à 6 chiffres a été envoyé au <strong id="telMasque"></strong>.
          Il est valable 15 minutes.
        </p>
        <div class="form-group">
          <label class="form-label" for="code">Code reçu par SMS</label>
          <input type="text" id="code" class="form-input code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Continuer</button>
        <div class="resend">
          <span id="resendWait"></span>
          <button type="button" class="link-button hidden" id="btnResend">Renvoyer le code</button>
        </div>
      </form>

      <!-- Étape 3 : nouveau mot de passe, envoyé avec le code -->
      <form id="step3" class="hidden" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">Nouveau mot de passe</label>
          <input type="password" id="password" class="form-input" placeholder="Minimum 8 caractères" minlength="8" autocomplete="new-password" required>

        </div>
        <div class="form-group">
          <label class="form-label" for="password2">Confirmer le mot de passe</label>
          <input type="password" id="password2" class="form-input" autocomplete="new-password" required>

        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn3">Enregistrer le mot de passe</button>
        <p style="text-align:center;margin-top:var(--space-3)">
          <button type="button" class="link-button" id="btnBack">Modifier le code</button>
        </p>
      </form>

      <p style="text-align:center; margin-top:var(--space-6);">
        <a href="/pages/login.html">Retour à la connexion</a>
      </p>
      <p style="text-align:center; margin-top:var(--space-2); font-size:var(--font-size-xs); color:var(--gris-500);">
        Démo : les SMS sont simulés, le code apparaît dans les logs du BFF
        (<code>docker compose logs espace-usager</code>).
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const ETAPES = ['Identification', 'Code reçu par SMS', 'Nouveau mot de passe'];
    // Délai avant de pouvoir redemander un code, pour éviter les envois en rafale.
    const DELAI_RENVOI_S = 60;
    const MIN_LONGUEUR = 8;

    const el = id => document.getElementById(id);
    const alertEl = el('alert');
    let tokenTemporaire = null;
    let telephone = null;
    let minuterie = null;

    function showAlert(msg, type) {
      alertEl.textContent = msg;
      alertEl.className = `alert alert-${type}`;
    }
    function hideAlert() { alertEl.className = 'alert hidden'; }

    /** Affiche l'étape n (1 à 3) et met à jour l'indicateur. */
    function afficherEtape(n) {
      [1, 2, 3].forEach(i => el('step' + i).classList.toggle('hidden', i !== n));
      document.querySelectorAll('.steps-bars span').forEach((b, i) => b.classList.toggle('done', i < n));
      el('stepsLabel').innerHTML = `Étape ${n} sur 3 : <strong>${ETAPES[n - 1]}</strong>`;
    }

    /** « 70 12 34 56 » ou « +22670123456 » devient « +22670123456 » (format du contrat). */
    function normaliserTelephone(saisie) {
      return '+226' + saisie.replace(/[\s.-]/g, '').replace(/^(\+|00)226/, '');
    }

    /** Ne laisse voir que les 2 derniers chiffres : « +226 ** ** ** 56 ». */
    function masquer(tel) {
      return '+226 ** ** ** ' + tel.slice(-2);
    }

    /** Lance le compte à rebours avant que « Renvoyer le code » soit disponible. */
    function demarrerMinuterie() {
      clearInterval(minuterie);
      let reste = DELAI_RENVOI_S;
      el('btnResend').classList.add('hidden');
      const tic = () => {
        if (reste <= 0) {
          clearInterval(minuterie);
          el('resendWait').textContent = 'Code non reçu ? ';
          el('btnResend').classList.remove('hidden');
          return;
        }
        el('resendWait').textContent = `Vous pourrez demander un nouveau code dans ${reste} s.`;
        reste--;
      };
      tic();
      minuterie = setInterval(tic, 1000);
    }

    /** Demande un code au BFF. La réponse est la même que le compte existe ou non. */
    async function envoyerCode() {
      const res = await authApi.motDePasseOublie(el('iue').value.trim(), telephone);
      tokenTemporaire = res.token_temporaire;
    }

    el('step1').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const iue = el('iue').value.trim();
      telephone = normaliserTelephone(el('telephone').value);
      if (!/^\d{12}$/.test(iue)) return showAlert("L'IUE doit contenir 12 chiffres", 'error');
      if (!/^\+226\d{8}$/.test(telephone)) return showAlert('Le numéro doit contenir 8 chiffres (ex : 70 12 34 56)', 'error');

      const btn = el('btn1');
      btn.disabled = true;
      try {
        await envoyerCode();
        el('telMasque').textContent = masquer(telephone);
        afficherEtape(2);
        demarrerMinuterie();
        el('code').focus();
      } catch (err) {
        showAlert(err.message || "Impossible d'envoyer le code", 'error');
      } finally {
        btn.disabled = false;
      }
    });

    // Le champ n'accepte que des chiffres, y compris quand un code est collé avec des espaces.
    el('code').addEventListener('input', () => {
      el('code').value = el('code').value.replace(/\D/g, '').slice(0, 6);
    });

    el('step2').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!/^\d{6}$/.test(el('code').value)) return showAlert('Le code contient 6 chiffres', 'error');
      hideAlert();
      afficherEtape(3);
      el('password').focus();
    });

    el('btnResend').addEventListener('click', async () => {
      const btn = el('btnResend');
      btn.disabled = true;
      try {
        await envoyerCode();
        el('code').value = '';
        showAlert('Un nouveau code a été demandé. Saisissez le dernier code reçu.', 'success');
        demarrerMinuterie();
        el('code').focus();
      } catch (err) {
        showAlert(err.message || "Impossible d'envoyer le code", 'error');
      } finally {
        btn.disabled = false;
      }
    });

    el('btnBack').addEventListener('click', () => {
      hideAlert();
      afficherEtape(2);
      el('code').focus();
    });

    el('step3').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = el('password').value;
      if (pwd.length < MIN_LONGUEUR) return showAlert(`Le mot de passe doit contenir au moins ${MIN_LONGUEUR} caractères`, 'error');
      if (pwd !== el('password2').value) return showAlert('Les mots de passe ne correspondent pas', 'error');

      const btn = el('btn3');
      btn.disabled = true;
      try {
        const res = await authApi.reinitialiserMotDePasse(tokenTemporaire, el('code').value, pwd);
        clearInterval(minuterie);
        el('step3').classList.add('hidden');
        el('stepsLabel').innerHTML = '<strong>Mot de passe modifié</strong>';
        showAlert((res.message || 'Mot de passe réinitialisé avec succès') + '. Redirection vers la connexion dans 3 secondes.', 'success');
        setTimeout(() => { window.location.href = '/pages/login.html'; }, 3000);
      } catch (err) {
        btn.disabled = false;
        // Code faux ou expiré : le BFF ne distingue pas les cas, on revient à la saisie du code.
        if (err.code === 'CODE_INVALIDE') {
          afficherEtape(2);
          el('code').value = '';
          el('code').focus();
        }
        showAlert(err.message || 'Code invalide ou expiré', 'error');
      }
    });

    afficherEtape(1);
    initPasswordToggles();
  </script>
</body>
</html>
