<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consentements | e-FASO</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="main-content">
    <div class="page-content">
      <h1 class="page-title">Consentements</h1>
      <p class="page-subtitle">Gérez les autorisations d'accès à vos données personnelles</p>

      <div class="stat-cards mb-6" id="consent-stats">
        <div class="stat-card">
          <div class="stat-value" id="stat-en-attente">-</div>
          <div class="stat-label">En attente</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-acceptes">-</div>
          <div class="stat-label">Acceptés</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-refuses">-</div>
          <div class="stat-label">Refusés</div>
        </div>
      </div>

      <div class="card mb-4">
        <div style="padding:var(--space-4) var(--space-4) 0">
          <div class="tabs" id="filter-tabs" style="margin-bottom:0;flex-wrap:wrap">
            <button class="tab active" data-filter="tous">Tous</button>
            <button class="tab" data-filter="en_attente">En attente</button>
            <button class="tab" data-filter="accepte">Acceptés</button>
            <button class="tab" data-filter="refuse">Refusés</button>
            <button class="tab" data-filter="expire">Expirés</button>
          </div>
        </div>
        <div class="filter-bar">
          <div class="filter-field grow">
            <label for="f-recherche">Rechercher</label>
            <div class="search-field">
              <input type="search" class="form-input" id="f-recherche" placeholder="Administration, démarche, donnée demandée, enfant…" autocomplete="off">
            </div>
          </div>
        </div>
        <div class="filter-count" id="f-count" aria-live="polite"></div>
      </div>

      <div id="consent-list">
        <div class="text-center" style="padding:var(--space-8);color:var(--gris-400)">Chargement…</div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let currentFilter = 'tous';
    let allConsentements = [];
    // Lien depuis « Mes enfants » (?enfant=<iue>) : seules les demandes de cet enfant sont affichées.
    const enfantFiltre = new URLSearchParams(window.location.search).get('enfant');

    async function loadConsentements() {
      try {
        const data = await consentsApi.list({ limite: 100 });
        allConsentements = data.consentements || [];
        if (enfantFiltre) {
          allConsentements = allConsentements.filter(c => c.pour_enfant?.iue === enfantFiltre);
        }
        renderList();
        loadStats();
      } catch (e) {
        document.getElementById('consent-list').innerHTML =
          `<div class="alert alert-error">Erreur lors du chargement des consentements : ${escapeHtml(e.message)}</div>`;
      }
    }

    async function loadStats() {
      const en_attente = allConsentements.filter(c => c.statut === 'en_attente').length;
      const acceptes = allConsentements.filter(c => c.statut === 'accepte').length;
      const refuses = allConsentements.filter(c => c.statut === 'refuse').length;
      document.getElementById('stat-en-attente').textContent = en_attente;
      document.getElementById('stat-acceptes').textContent = acceptes;
      document.getElementById('stat-refuses').textContent = refuses;
    }

    function renderList() {
      const container = document.getElementById('consent-list');
      let items = allConsentements;
      if (currentFilter !== 'tous') {
        items = items.filter(c => c.statut === currentFilter);
      }
      const recherche = document.getElementById('f-recherche').value;
      items = items.filter(c => correspond(recherche,
        c.administration_nom, c.demarche_nom, c.champs_demandes,
        c.pour_enfant && [c.pour_enfant.prenom, c.pour_enfant.nom]));
      document.getElementById('f-count').textContent = recherche.trim()
        ? `${items.length} résultat${items.length > 1 ? 's' : ''} pour « ${recherche.trim()} »`
        : '';

      if (items.length === 0) {
        container.innerHTML = `
          <div class="card text-center" style="padding:var(--space-8);color:var(--gris-400)">
            <p>Aucun consentement ${recherche.trim() ? 'ne correspond à votre recherche' : currentFilter !== 'tous' ? 'avec ce statut' : 'pour le moment'}</p>
          </div>`;
        return;
      }

      container.innerHTML = items.map(c => `
        <div class="card mb-4" style="padding:var(--space-5)">
          <div class="flex-between mb-2">
            <div>
              <strong style="font-size:var(--font-size-base)">${escapeHtml(c.administration_nom) || VIDE}</strong>
              <span style="color:var(--gris-400);margin-left:var(--space-2);font-size:var(--font-size-xs)">${formatDate(c.date_creation)}</span>
            </div>
            ${statusBadge(c.statut)}
          </div>
          ${c.pour_enfant ? `
            <div style="font-size:var(--font-size-xs);color:var(--or-fonce);margin-bottom:var(--space-2)">
              Concerne votre enfant : ${escapeHtml([c.pour_enfant.prenom, c.pour_enfant.nom].filter(Boolean).join(' ') || c.pour_enfant.iue)}
            </div>` : ''}
          <p style="color:var(--gris-600);font-size:var(--font-size-sm);margin-bottom:var(--space-3)">
            Démarche : <strong>${escapeHtml(c.demarche_nom) || VIDE}</strong>
          </p>
          ${Array.isArray(c.champs_demandes) && c.champs_demandes.length ? `
            <p style="font-size:var(--font-size-sm);color:var(--gris-600);margin-bottom:var(--space-3)">
              Données demandées : ${escapeHtml(c.champs_demandes.join(', '))}
            </p>` : ''}
          ${c.statut === 'en_attente' ? `
            <div style="display:flex;gap:var(--space-3);margin-top:var(--space-3)">
              <button class="btn btn-sm btn-primary" onclick="decider('${escapeHtml(c.id)}', 'accepte', this)">Accepter</button>
              <button class="btn btn-sm btn-danger" onclick="decider('${escapeHtml(c.id)}', 'refuse', this)">Refuser</button>
            </div>` : ''}
          ${c.statut === 'en_attente' && c.date_expiration ? `
            <div style="font-size:var(--font-size-xs);color:var(--gris-400);margin-top:var(--space-2)">
              Expire le ${formatDate(c.date_expiration)}
            </div>` : ''}
        </div>
      `).join('');
    }

    async function decider(id, decision, btn) {
      if (btn) btn.parentElement.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try {
        await consentsApi.decide(id, decision);
        showToast(decision === 'accepte' ? 'Consentement accepté' : 'Consentement refusé',
                  decision === 'accepte' ? 'success' : 'warning');
        loadConsentements();
      } catch (e) {
        showToast(e.message || 'Erreur lors de la décision', 'error');
        if (btn) btn.parentElement.querySelectorAll('button').forEach(b => { b.disabled = false; });
      }
    }

    document.getElementById('filter-tabs').addEventListener('click', e => {
      if (e.target.classList.contains('tab')) {
        document.querySelectorAll('#filter-tabs .tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderList();
      }
    });

    document.getElementById('f-recherche').addEventListener('input', debounce(renderList));

    loadConsentements();
  </script>
</body>
</html>
