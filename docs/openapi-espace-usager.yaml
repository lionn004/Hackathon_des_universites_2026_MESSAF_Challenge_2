openapi: 3.0.3
info:
  title: Espace Usager API (Backend for Frontend)
  description: |
    API consommée directement par le frontend web (HTML / CSS / JavaScript),
    et plus tard par l'application mobile (même contrat, authentification par
    en-tête Authorization, sans cookies).
    Regroupe les endpoints d'authentification, le profil citoyen,
    les demandes de pièces, et les fonctionnalités tuteur/enfant.

    Cette API sert de BFF (Backend for Frontend) : elle orchestre
    les appels vers la passerelle, le consentement et le journal
    pour le compte du frontend.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: BFF espace usager (dev)

tags:
  - name: Authentification
    description: Connexion, inscription et récupération de mot de passe
  - name: Profil
    description: Profil et informations du citoyen connecté
  - name: Enfants
    description: Gestion des comptes enfants (tuteur)
  - name: Demandes
    description: Demandes de pièces par le citoyen
  - name: Consentements
    description: Gestion des consentements (proxy vers service consentement)
  - name: Journal
    description: Journal d'accès (proxy vers service journal)
  - name: Tableau de bord
    description: Données agrégées pour le dashboard citoyen
  - name: Test
    description: Interface de test pour simuler des requêtes administration

paths:
  # ═══════════════════════════════════════
  # AUTHENTIFICATION
  # ═══════════════════════════════════════
  /auth/inscription:
    post:
      tags: [Authentification]
      summary: Créer un compte citoyen
      description: |
        Le citoyen ne fournit que son IUE, un mot de passe et son téléphone : son nom,
        sa date de naissance et ses enfants sont lus à l'état civil. Ses enfants
        mineurs sans compte sont rattachés automatiquement à son compte (tuteur).
        L'exemple est Salif OUEDRAOGO, citoyen de démonstration connu de l'état civil
        mais sans compte (sa fille Aïcha est rattachée automatiquement).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iue, mot_de_passe, telephone]
              properties:
                iue:
                  type: string
                  example: "316580942751"
                mot_de_passe:
                  type: string
                  format: password
                  minLength: 8
                  example: "Salif2026!"
                telephone:
                  type: string
                  example: "+22670998877"
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthReponse"
        "400":
          description: Données invalides (IUE, mot de passe < 8 caractères, téléphone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "403":
          description: "COMPTE_MINEUR : le compte d'un mineur est créé et géré par son tuteur"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: "IUE_INCONNU : IUE inconnu de l'état civil"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "409":
          description: IUE déjà enregistré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /auth/connexion:
    post:
      tags: [Authentification]
      summary: Se connecter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iue, mot_de_passe]
              properties:
                iue:
                  type: string
                  example: "784302956148"
                mot_de_passe:
                  type: string
                  format: password
                  description: L'exemple est le mot de passe du compte de démonstration d'Amadou.
                  example: "Amadou2026!"
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthReponse"
        "401":
          description: IUE ou mot de passe incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "400":
          description: "DONNEES_INVALIDES : iue ou mot de passe mal formé"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /auth/mot-de-passe-oublie:
    post:
      tags: [Authentification]
      summary: Demander la réinitialisation du mot de passe
      description: |
        Envoie un code de vérification par SMS au numéro associé.
        La réponse est toujours la même, que l'IUE ait un compte ou non : elle ne
        révèle jamais si un compte existe. Le frontend ne doit donc pas afficher
        « compte introuvable ».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iue, telephone]
              properties:
                iue:
                  type: string
                  example: "784302956148"
                telephone:
                  type: string
                  example: "+22670123456"
      responses:
        "200":
          description: Code envoyé par SMS (si l'IUE et le téléphone correspondent à un compte)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Si les informations correspondent, un code de vérification a été envoyé par SMS"
                  token_temporaire:
                    type: string
                    description: Token à usage unique pour l'étape suivante
        "400":
          description: "DONNEES_INVALIDES : iue ou téléphone mal formé"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /auth/reinitialiser-mot-de-passe:
    post:
      tags: [Authentification]
      summary: Réinitialiser le mot de passe avec le code SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_temporaire, code_sms, nouveau_mot_de_passe]
              properties:
                token_temporaire:
                  type: string
                  description: Valeur renvoyée par POST /auth/mot-de-passe-oublie
                code_sms:
                  type: string
                  example: "123456"
                nouveau_mot_de_passe:
                  type: string
                  format: password
                  minLength: 8
                  example: "NouveauMotDePasse2026"
      responses:
        "200":
          description: Mot de passe modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Mot de passe réinitialisé avec succès"
        "400":
          description: "DONNEES_INVALIDES ou CODE_INVALIDE : code SMS faux ou expiré, mot de passe trop court"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ═══════════════════════════════════════
  # PROFIL
  # ═══════════════════════════════════════
  /profil:
    get:
      tags: [Profil]
      summary: Consulter son profil
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil du citoyen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilCitoyen"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ═══════════════════════════════════════
  # ENFANTS (TUTEUR)
  # ═══════════════════════════════════════
  /enfants:
    get:
      tags: [Enfants]
      summary: Lister les enfants rattachés
      description: Retourne les comptes enfants dont le citoyen est tuteur.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Liste des enfants
          content:
            application/json:
              schema:
                type: object
                properties:
                  enfants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Enfant"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /enfants/{iue}/transfert:
    post:
      tags: [Enfants]
      summary: Transférer un compte enfant
      description: |
        Le tuteur transfère le contrôle du compte à l'enfant (15+ ans).
        L'enfant devra créer son propre mot de passe.
      security:
        - BearerAuth: []
      parameters:
        - name: iue
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transfert initié
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Transfert initié. L'enfant recevra un SMS pour créer son mot de passe."
        "400":
          description: Enfant trop jeune ou déjà transféré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ═══════════════════════════════════════
  # DEMANDES DE PIÈCES
  # ═══════════════════════════════════════
  /types-pieces:
    get:
      tags: [Demandes]
      summary: Lister les pièces que le citoyen peut demander
      description: |
        Catalogue des types de pièces, pour le formulaire « Demander une pièce »
        (la valeur `id` est le `type_piece_id` attendu par POST /demandes).
        Pour chaque pièce, `prerequis` indique les documents que la plateforme
        ira chercher automatiquement (résolution en cascade). Route publique :
        elle ne contient aucune donnée personnelle.
      responses:
        "200":
          description: Catalogue des types de pièces
          content:
            application/json:
              schema:
                type: object
                properties:
                  types_pieces:
                    type: array
                    items:
                      $ref: "#/components/schemas/TypePiece"

  /registres:
    get:
      tags: [Demandes]
      summary: État des registres branchés (relais public de la passerelle)
      description: |
        Registres de la plateforme, leur disponibilité (sondée toutes les 5 s) et les
        opérations qu'ils servent. L'espace usager l'affiche pour expliquer une attente :
        « registre casier momentanément indisponible, votre demande reprendra automatiquement ».
        Route publique, sans donnée personnelle. Schéma : EtatRegistres de la passerelle.
      responses:
        "200":
          description: État des registres
          content:
            application/json:
              schema:
                type: object
                properties:
                  registres:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        nom:
                          type: string
                        proprietaire:
                          type: string
                          nullable: true
                        etat:
                          type: string
                          enum: [actif, suspendu]
                        disponibilite:
                          type: string
                          enum: [disponible, hors_service]
                        depuis:
                          type: string
                          format: date-time
                        derniere_verification:
                          type: string
                          format: date-time
                          nullable: true
                        identification:
                          type: string
                          enum: [iue, recherche]
                        operations:
                          type: array
                          items:
                            type: string
                  sources:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string

  /dictionnaire:
    get:
      tags: [Demandes]
      summary: Dictionnaire des données (relais public de la passerelle)
      description: |
        Libellé de chaque donnée de la plateforme, par domaine : le journal du citoyen
        affiche « Majeur » plutôt que « est_majeur ». Route publique. Schéma : Dictionnaire
        de la passerelle.
      responses:
        "200":
          description: Dictionnaire
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  domaines:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          libelle:
                            type: string
                          type:
                            type: string
                          sensibilite:
                            type: string
                          operation:
                            type: string
                          calculee:
                            type: boolean

  /demandes:
    get:
      tags: [Demandes]
      summary: Lister ses demandes de pièces
      security:
        - BearerAuth: []
      parameters:
        - name: statut
          in: query
          description: |
            Filtrer par statut. `fallback_physique` = une pièce de la cascade manque
            dans les registres numériques (donnée à numériser par l'administration qui la détient).
          schema:
            type: string
            enum: [en_cours, complete, echouee, fallback_physique]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limite
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Liste des demandes
          content:
            application/json:
              schema:
                type: object
                properties:
                  demandes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Demande"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: "DONNEES_INVALIDES : statut, page ou limite invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

    post:
      tags: [Demandes]
      summary: Créer une demande de pièce
      description: |
        Le citoyen demande une pièce. La passerelle résout automatiquement
        la chaîne de dépendances en cascade.
        Retourne la demande avec l'arbre de résolution.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type_piece_id]
              properties:
                type_piece_id:
                  type: string
                  example: "casier-judiciaire"
                pour_enfant_iue:
                  type: string
                  nullable: true
                  description: Si la demande est pour un enfant du tuteur
      responses:
        "201":
          description: Demande créée avec arbre de résolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demande"
        "403":
          description: "ENFANT_NON_RATTACHE : pour_enfant_iue n'est pas un enfant du citoyen connecté"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: TYPE_PIECE_INCONNU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "400":
          description: "DONNEES_INVALIDES : type_piece_id manquant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /demandes/{id}:
    get:
      tags: [Demandes]
      summary: Détail d'une demande
      description: Inclut l'arbre de résolution cascade et le statut de chaque prérequis.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail de la demande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demande"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: "DEMANDE_NON_TROUVEE : demande inconnue ou d'un autre citoyen"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /demandes/{id}/contenu:
    get:
      tags: [Demandes]
      summary: Contenu de la pièce d'une demande (consultation, impression)
      description: |
        Renvoie le contenu de la pièce, lu à l'instant dans son registre par la passerelle :
        aucune copie n'est stockée, une pièce évolutive (casier, situation fiscale) est donc
        toujours à jour. Le frontend en fait une page imprimable portant la mention
        « Document informatif, non officiel » ; les registres ne délivrent jamais de PDF.

        Accès : le titulaire de la pièce, ou son tuteur actuel (tutelle relue à chaque
        appel). Après un transfert de compte, l'ancien tuteur perd l'accès, même pour les
        demandes qu'il a faites lui-même.

        Ni minimisation ni journal : le citoyen consulte ses propres données, aucune
        administration n'y accède.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contenu de la pièce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContenuPiece"
              examples:
                casier-judiciaire:
                  summary: Casier judiciaire d'Amadou
                  value:
                    demande_id: "3f2b8c1e-5d4a-4e9b-9c7d-2a1b0c9d8e7f"
                    type_piece:
                      id: "casier-judiciaire"
                      nom: "Casier judiciaire"
                      registre_source: "justice"
                      est_evolutive: true
                    titulaire:
                      iue: "784302956148"
                      nom: "OUEDRAOGO"
                      prenom: "Amadou"
                    donnees:
                      casier_vierge: true
                      condamnations: []
                      date_delivrance: "2026-11-17"
                    date_consultation: "2026-11-17T18:00:00.000Z"
                extrait-naissance:
                  summary: Extrait de naissance d'Amadou (parents identifiés)
                  value:
                    demande_id: "8a6d2f40-1c3b-4b7e-a5d9-6e0f1a2b3c4d"
                    type_piece:
                      id: "extrait-naissance"
                      nom: "Extrait de naissance"
                      registre_source: "etat-civil"
                      est_evolutive: false
                    titulaire:
                      iue: "784302956148"
                      nom: "OUEDRAOGO"
                      prenom: "Amadou"
                    donnees:
                      nom: "OUEDRAOGO"
                      prenom: "Amadou"
                      date_naissance: "1998-03-15"
                      lieu_naissance: "Ouagadougou"
                      sexe: "M"
                      nationalite: "Burkinabè"
                      pere:
                        iue: "291047583620"
                        nom: "OUEDRAOGO"
                        prenom: "Ibrahim"
                      mere:
                        iue: "638501274093"
                        nom: "SAWADOGO"
                        prenom: "Fatimata"
                      date_deces: null
                      est_majeur: true
                    date_consultation: "2026-11-17T18:00:00.000Z"
                certificat-nationalite:
                  summary: Certificat de nationalité d'Amadou
                  value:
                    demande_id: "c47e9b12-0a5f-4d3e-8b61-9f2a7c5d0e18"
                    type_piece:
                      id: "certificat-nationalite"
                      nom: "Certificat de nationalité"
                      registre_source: "justice"
                      est_evolutive: false
                    titulaire:
                      iue: "784302956148"
                      nom: "OUEDRAOGO"
                      prenom: "Amadou"
                    donnees:
                      est_national: true
                      nationalite: "Burkinabè"
                      mode_acquisition: "naissance"
                      date_acquisition: "1998-03-15"
                      numero_certificat: "CN-2020-00456"
                    date_consultation: "2026-11-17T18:00:00.000Z"
                attestation-fiscale:
                  summary: Attestation de situation fiscale d'Amadou
                  value:
                    demande_id: "5b1d0e7a-9c2f-4a68-b3e4-0d7f6a1c2b95"
                    type_piece:
                      id: "attestation-fiscale"
                      nom: "Attestation de situation fiscale"
                      registre_source: "fiscal"
                      est_evolutive: true
                    titulaire:
                      iue: "784302956148"
                      nom: "OUEDRAOGO"
                      prenom: "Amadou"
                    donnees:
                      ifu: "IFU-00012345"
                      en_regle: true
                      type_contribuable: "particulier"
                      regime_fiscal: "non_assujetti"
                      derniere_declaration: "2026-03-31"
                      montant_impot_du: 0
                    date_consultation: "2026-11-17T18:00:00.000Z"
        "401":
          description: "AUTH_REQUISE ou TOKEN_INVALIDE : jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: |
            DEMANDE_NON_TROUVEE : demande inconnue, ou pièce d'une personne dont le citoyen
            n'est ni le titulaire ni le tuteur actuel (la réponse ne révèle pas que la demande existe).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "409":
          description: |
            PIECE_INDISPONIBLE : la demande n'est pas `complete` (ex : fallback_physique), ou la
            pièce est absente du registre aujourd'hui (ex : registre remplacé par celui d'une
            autre équipe). Dans les deux cas, la pièce n'est pas lisible en ligne aujourd'hui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
              example:
                code: "PIECE_INDISPONIBLE"
                message: "Cette pièce n'est pas encore disponible : sa demande n'est pas terminée, ou elle n'est pas encore numérisée dans son registre"
        "502":
          description: "SERVICE_INDISPONIBLE ou SERVICE_EN_ERREUR : la passerelle ou un registre ne répond pas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "503":
          description: "REGISTRE_INDISPONIBLE : le registre de la pièce est momentanément hors service ; réessayer plus tard"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ═══════════════════════════════════════
  # CONSENTEMENTS (proxy)
  # ═══════════════════════════════════════
  /consentements:
    get:
      tags: [Consentements]
      summary: Lister les demandes de consentement
      description: Proxy vers le service consentement.
      security:
        - BearerAuth: []
      parameters:
        - name: statut
          in: query
          schema:
            type: string
            enum: [en_attente, accepte, refuse, expire]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limite
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Liste des consentements
          content:
            application/json:
              schema:
                type: object
                properties:
                  consentements:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentementResume"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: "DONNEES_INVALIDES : statut, page ou limite invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /consentements/{id}:
    get:
      tags: [Consentements]
      summary: Détail d'un consentement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentementResume"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: "CONSENTEMENT_NON_TROUVE : demande inconnue ou d'un autre citoyen"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

    put:
      tags: [Consentements]
      summary: Accepter ou refuser un consentement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accepte, refuse]
      responses:
        "200":
          description: Décision enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentementResume"
        "400":
          description: "DONNEES_INVALIDES, CONSENTEMENT_DEJA_TRAITE ou CONSENTEMENT_EXPIRE : décision invalide, demande déjà traitée ou expirée"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: "CONSENTEMENT_NON_TROUVE : demande inconnue ou d'un autre citoyen"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ═══════════════════════════════════════
  # JOURNAL (proxy)
  # ═══════════════════════════════════════
  /journal:
    get:
      tags: [Journal]
      summary: Consulter son journal d'accès
      description: Proxy vers le service journal.
      security:
        - BearerAuth: []
      parameters:
        - name: date_debut
          in: query
          schema:
            type: string
            format: date
        - name: date_fin
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limite
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Entrées du journal
          content:
            application/json:
              schema:
                type: object
                properties:
                  entrees:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntreeJournal"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: "DONNEES_INVALIDES : dates, page ou limite invalides"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ═══════════════════════════════════════
  # TABLEAU DE BORD
  # ═══════════════════════════════════════
  /tableau-de-bord:
    get:
      tags: [Tableau de bord]
      summary: Données agrégées pour le dashboard
      description: |
        Retourne en un seul appel toutes les données nécessaires
        pour afficher le tableau de bord du citoyen.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Données du tableau de bord
          content:
            application/json:
              schema:
                type: object
                properties:
                  citoyen:
                    type: object
                    description: "Nom et prénom lus à l'état civil ; null si l'état civil ne connaît pas (ou plus) le citoyen, par exemple après le remplacement du registre."
                    properties:
                      nom:
                        type: string
                        nullable: true
                      prenom:
                        type: string
                        nullable: true
                  consentements_en_attente:
                    type: integer
                    example: 2
                  demandes_en_cours:
                    type: integer
                    example: 1
                  acces_recents:
                    type: integer
                    description: Nombre d'accès dans les 30 derniers jours
                    example: 5
                  enfants:
                    type: integer
                    description: Nombre d'enfants rattachés
                    example: 0
                  alertes:
                    type: array
                    description: Notifications importantes
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [consentement, transfert_recommande, acces]
                        message:
                          type: string
                        lien:
                          type: string
                          description: Route frontend vers l'élément concerné
        "401":
          description: "Jeton absent, invalide ou expiré"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ═══════════════════════════════════════
  # INTERFACE DE TEST (admin simulation)
  # ═══════════════════════════════════════
  /test/administrations:
    get:
      tags: [Test]
      summary: Lister les administrations simulées
      responses:
        "200":
          description: Liste des administrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  administrations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        nom:
                          type: string
                          example: "Université Joseph KI-ZERBO"
                        type:
                          type: string
                          enum: [publique, privee]
                        domaine_mission:
                          type: string
                          example: "education"

  /test/demarches:
    get:
      tags: [Test]
      summary: Lister les démarches disponibles
      responses:
        "200":
          description: Liste des démarches
          content:
            application/json:
              schema:
                type: object
                properties:
                  demarches:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        nom:
                          type: string
                        administration_cible:
                          type: string

  /test/requete:
    post:
      tags: [Test]
      summary: Simuler une requête d'administration
      description: |
        Simule une requête comme si elle venait d'une administration
        (publique ou privée). Utile pour tester la chaîne complète :
        passerelle → minimisation → consentement → journal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [administration_id, iue_citoyen, demarche_id]
              properties:
                administration_id:
                  type: string
                  format: uuid
                iue_citoyen:
                  type: string
                  example: "784302956148"
                demarche_id:
                  type: string
                  example: "inscription-universite"
      responses:
        "200":
          description: Résultat (admin publique, données retournées)
          content:
            application/json:
              schema:
                type: object
                properties:
                  type_admin:
                    type: string
                    enum: [publique]
                  donnees:
                    type: object
                  cascade:
                    type: array
                    items:
                      type: object
                  journal_id:
                    type: string
                    format: uuid
                  requete_id:
                    type: string
                    format: uuid
                    description: Identifiant de la requête dans la passerelle
        "202":
          description: "En attente : consentement du citoyen (admin privée) ou registre hors service (statut en_attente_registre)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  type_admin:
                    type: string
                    enum: [publique, privee]
                  statut:
                    type: string
                    enum: [en_attente_consentement, en_attente_registre]
                  registres_indisponibles:
                    type: array
                    items:
                      type: string
                    description: Présent seulement si statut = en_attente_registre
                  consentement_id:
                    type: string
                    format: uuid
                  requete_id:
                    type: string
                    format: uuid
                    description: À utiliser avec GET /test/requetes/{id} pour suivre la requête
                  message:
                    type: string
                    example: "Demande de consentement envoyée au citoyen"
        "403":
          description: "Refus de la passerelle (ex : HORS_MISSION), relayé tel quel"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "400":
          description: "DONNEES_INVALIDES : administration_id, iue_citoyen ou demarche_id invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: "CITOYEN_NON_TROUVE ou DEMARCHE_INCONNUE (relayé de la passerelle), ou INTERFACE_TEST_DESACTIVEE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /test/requetes/{id}:
    get:
      tags: [Test]
      summary: Suivre une requête simulée
      description: |
        Consulte le statut d'une requête faite via POST /test/requete, au nom de la même
        administration (ex : voir les données arriver après l'acceptation du citoyen).
        Remise unique (comme GET /requetes/{id} de la passerelle) : les données ne sont
        renvoyées que par la première consultation après l'acceptation, puis `donnees` vaut null.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: administration_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Statut de la requête (RequeteStatut de la passerelle)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requete_id:
                    type: string
                    format: uuid
                  statut:
                    type: string
                    enum: [en_attente_consentement, consentement_accepte, consentement_refuse, expire, complete, en_attente_registre, echouee]
                  donnees:
                    type: object
                    nullable: true
                  registres_indisponibles:
                    type: array
                    items:
                      type: string
                    description: Présent seulement si statut = en_attente_registre
                  date_creation:
                    type: string
                    format: date-time
                  date_expiration:
                    type: string
                    format: date-time
                    nullable: true
                  date_reponse:
                    type: string
                    format: date-time
                    nullable: true
        "400":
          description: "DONNEES_INVALIDES : administration_id invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: "REQUETE_NON_TROUVEE, ou INTERFACE_TEST_DESACTIVEE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ═══════════════════════════════════════
  # INTERNE (réservé aux services backend, jamais appelé par le frontend)
  # ═══════════════════════════════════════
  /interne/citoyens/{iue}/telephone:
    get:
      tags: [Interne]
      summary: Téléphone d'un citoyen (appelé par la passerelle)
      description: |
        Protégé par la clé de service partagée (en-tête X-Cle-Service).
        Utilisé quand une administration relance un citoyen qui tarde à répondre.
      parameters:
        - name: iue
          in: path
          required: true
          schema:
            type: string
        - name: X-Cle-Service
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Numéro du compte
          content:
            application/json:
              schema:
                type: object
                properties:
                  telephone:
                    type: string
        "401":
          description: Clé de service absente ou invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: "TELEPHONE_INCONNU : pas de compte pour cet IUE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenu via /auth/connexion

  schemas:
    AuthReponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        citoyen:
          type: object
          properties:
            iue:
              type: string
            nom:
              type: string
              nullable: true
              description: "null si l'état civil est momentanément indisponible ou ne connaît pas le citoyen"
            prenom:
              type: string
              nullable: true
            telephone:
              type: string

    ProfilCitoyen:
      type: object
      properties:
        iue:
          type: string
          example: "784302956148"
        nom:
          type: string
          nullable: true
          example: "OUEDRAOGO"
          description: "Lu à l'état civil ; null si l'état civil ne connaît pas (ou plus) le citoyen, par exemple après le remplacement du registre"
        prenom:
          type: string
          nullable: true
          example: "Amadou"
        telephone:
          type: string
          example: "+22670123456"
        date_inscription:
          type: string
          format: date-time
        est_tuteur:
          type: boolean
        nombre_enfants:
          type: integer

    Enfant:
      type: object
      properties:
        iue:
          type: string
        nom:
          type: string
        prenom:
          type: string
        date_naissance:
          type: string
          format: date
        age:
          type: integer
        transfert_recommande:
          type: boolean
          description: True si l'enfant a 15 ans ou plus

    TypePiece:
      type: object
      properties:
        id:
          type: string
          example: "casier-judiciaire"
        nom:
          type: string
          example: "Casier judiciaire"
        registre_source:
          type: string
          enum: [etat-civil, justice, fiscal]
          example: "justice"
        est_evolutive:
          type: boolean
          description: La pièce peut changer dans le temps (casier, situation fiscale)
        demarche_si_absente:
          type: string
          nullable: true
          description: "Démarche à suivre quand la pièce n'est pas encore dans le registre numérique (statut fallback_physique, nœud manquant). À afficher sous la pièce manquante : la plateforme informe, elle ne recueille rien. Texte neutre, valable aussi pour la pièce d'un parent ; null si aucune n'est connue."
          example: "Demander au centre d'état civil du lieu de naissance de la personne concernée de numériser son acte de naissance. Si la naissance n'a jamais été déclarée, un jugement supplétif doit d'abord être obtenu auprès du tribunal."
        prerequis:
          type: array
          description: Documents récupérés automatiquement par la plateforme (arbre récursif)
          items:
            $ref: "#/components/schemas/PrerequisPiece"

    PrerequisPiece:
      type: object
      properties:
        type_piece:
          type: string
          example: "certificat-nationalite"
        nom:
          type: string
          example: "Certificat de nationalité"
        proprietaire:
          type: string
          enum: [citoyen, pere, mere]
          description: À qui appartient le document (le titulaire de la pièce parente, son père ou sa mère)
        prerequis:
          type: array
          items:
            $ref: "#/components/schemas/PrerequisPiece"

    Demande:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type_piece:
          type: object
          properties:
            id:
              type: string
            nom:
              type: string
              example: "Casier judiciaire"
        statut:
          type: string
          enum: [en_cours, complete, echouee, fallback_physique]
          description: |
            en_cours : un registre nécessaire est hors service ; la reprise automatique termine la
            demande à son retour. fallback_physique : une donnée numérique manque (pièce à numériser) ; la reprise
            automatique la termine dès que la pièce est numérisée dans son registre.
        pour_enfant:
          type: object
          nullable: true
          properties:
            iue:
              type: string
            nom:
              type: string
            prenom:
              type: string
        cascade:
          type: array
          description: Arbre de résolution des dépendances
          items:
            type: object
            properties:
              type_piece:
                type: string
                example: "certificat-nationalite"
              proprietaire:
                type: string
                enum: [citoyen, pere, mere]
              statut:
                type: string
                enum: [resolu, en_cours, manquant]
                description: "en_cours : registre hors service, vérification reprise automatiquement ; manquant : donnée à numériser dans son registre"
              sous_prerequis:
                type: array
                items:
                  type: object
        date_creation:
          type: string
          format: date-time
        date_completion:
          type: string
          format: date-time
          nullable: true

    PersonneIdentifiee:
      type: object
      description: Identité réduite au strict nécessaire (titulaire d'une pièce, parents d'un extrait de naissance)
      properties:
        iue:
          type: string
          example: "784302956148"
        nom:
          type: string
          example: "OUEDRAOGO"
        prenom:
          type: string
          example: "Amadou"

    ContenuPiece:
      type: object
      description: |
        Contenu d'une pièce, lu dans son registre au moment de la consultation (aucune copie
        stockée). Destiné à une page imprimable marquée « Document informatif, non officiel ».
      properties:
        demande_id:
          type: string
          format: uuid
        type_piece:
          type: object
          properties:
            id:
              type: string
              example: "casier-judiciaire"
            nom:
              type: string
              example: "Casier judiciaire"
            registre_source:
              type: string
              enum: [etat-civil, justice, fiscal]
              example: "justice"
            est_evolutive:
              type: boolean
              description: La pièce peut changer dans le temps (casier, situation fiscale)
        titulaire:
          $ref: "#/components/schemas/PersonneIdentifiee"
        donnees:
          description: |
            Champs de la pièce selon `type_piece.id`, sans `iue` (déjà dans `titulaire`) :
            extrait-naissance → DonneesExtraitNaissance, certificat-nationalite →
            DonneesCertificatNationalite, casier-judiciaire → DonneesCasierJudiciaire,
            attestation-fiscale → DonneesSituationFiscale.
          oneOf:
            - $ref: "#/components/schemas/DonneesExtraitNaissance"
            - $ref: "#/components/schemas/DonneesCertificatNationalite"
            - $ref: "#/components/schemas/DonneesCasierJudiciaire"
            - $ref: "#/components/schemas/DonneesSituationFiscale"
        date_consultation:
          type: string
          format: date-time
          description: Moment de la lecture dans le registre

    DonneesExtraitNaissance:
      type: object
      description: Pièce extrait-naissance (registre état-civil)
      properties:
        nom:
          type: string
          example: "OUEDRAOGO"
        prenom:
          type: string
          example: "Amadou"
        date_naissance:
          type: string
          format: date
          example: "1998-03-15"
        lieu_naissance:
          type: string
          example: "Ouagadougou"
        sexe:
          type: string
          enum: [M, F]
        nationalite:
          type: string
          example: "Burkinabè"
        pere:
          description: Remplace pere_iue du registre ; null si le père est inconnu de l'état civil
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonneIdentifiee"
        mere:
          description: Remplace mere_iue du registre ; null si la mère est inconnue de l'état civil
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonneIdentifiee"
        date_deces:
          type: string
          format: date
          nullable: true
        est_majeur:
          type: boolean

    DonneesCertificatNationalite:
      type: object
      description: Pièce certificat-nationalite (registre justice)
      properties:
        est_national:
          type: boolean
        nationalite:
          type: string
          example: "Burkinabè"
        mode_acquisition:
          type: string
          enum: [naissance, naturalisation, mariage]
        date_acquisition:
          type: string
          format: date
        numero_certificat:
          type: string
          example: "CN-2020-00456"

    DonneesCasierJudiciaire:
      type: object
      description: Pièce casier-judiciaire (registre justice)
      properties:
        casier_vierge:
          type: boolean
        condamnations:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              nature:
                type: string
              tribunal:
                type: string
              duree:
                type: string
        date_delivrance:
          type: string
          format: date

    DonneesSituationFiscale:
      type: object
      description: Pièce attestation-fiscale (registre fiscal)
      properties:
        ifu:
          type: string
          description: Identifiant Fiscal Unique
          example: "IFU-00012345"
        en_regle:
          type: boolean
          description: Le citoyen est-il à jour de ses obligations fiscales ?
        type_contribuable:
          type: string
          enum: [particulier, entreprise_individuelle, societe]
        regime_fiscal:
          type: string
          enum: [rsi, rni, cme, non_assujetti]
        derniere_declaration:
          type: string
          format: date
          nullable: true
        montant_impot_du:
          type: number
          format: float
          nullable: true

    ConsentementResume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        administration_nom:
          type: string
          example: "Banque Atlantique"
        administration_type:
          type: string
          enum: [privee]
        demarche_nom:
          type: string
          example: "Ouverture de compte bancaire"
        champs_demandes:
          type: array
          items:
            type: string
          example: ["nom", "prenom", "nationalite"]
        statut:
          type: string
          enum: [en_attente, accepte, refuse, expire]
        date_creation:
          type: string
          format: date-time
        date_expiration:
          type: string
          format: date-time
        pour_enfant:
          type: object
          nullable: true
          description: Présent si la demande concerne un enfant dont le citoyen est tuteur
          properties:
            iue:
              type: string
            nom:
              type: string
            prenom:
              type: string

    EntreeJournal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        administration_nom:
          type: string
          example: "Université Joseph KI-ZERBO"
        administration_type:
          type: string
          enum: [publique, privee]
        demarche:
          type: string
          example: "Inscription universitaire"
        champs_consultes:
          type: array
          items:
            type: string
          example: ["est_majeur", "nationalite"]
        type_acces:
          type: string
          enum: [direct, consentement]
        pour_enfant:
          type: object
          nullable: true
          description: Présent si l'accès concernait un enfant
          properties:
            iue:
              type: string
            nom:
              type: string
        date_acces:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limite:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    Erreur:
      type: object
      properties:
        code:
          type: string
          example: "AUTH_INVALIDE"
        message:
          type: string
          example: "IUE ou mot de passe incorrect"
