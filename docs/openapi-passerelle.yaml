openapi: 3.0.3
info:
  title: Passerelle DLNUF
  description: |
    API centrale de DLNUF, le socle d'interopérabilité : la passerelle d'échange
    que les administrations appellent.
    Route les requêtes entre administrations et registres.
    Gère la résolution des chaînes de dépendances en cascade.
    Applique le filtre de minimisation selon la démarche.

    Les registres ne sont pas écrits dans le code : ils sont décrits dans le catalogue
    des registres (config/catalogue-registres.yaml) et traduits vers le dictionnaire des
    données (config/dictionnaire.yaml). Un registre hors service est contourné : les
    requêtes qui en dépendent passent « en_attente_registre » et sont complétées à une
    consultation suivante (voir docs/conception-interoperabilite.md).
  version: 1.1.0

servers:
  - url: http://localhost:3004/api
    description: Passerelle (dev)

tags:
  - name: Démarches
    description: Catalogue des démarches disponibles
  - name: Requêtes
    description: Requêtes de données entre administrations
  - name: Types de pièces
    description: Catalogue des types de pièces et prérequis
  - name: Registres
    description: État des registres branchés et dictionnaire des données

paths:
  # ─── Catalogue des démarches ───
  /demarches:
    get:
      tags: [Démarches]
      summary: Lister toutes les démarches disponibles
      description: Retourne le catalogue des démarches avec leurs prérequis et champs requis par registre.
      responses:
        "200":
          description: Liste des démarches
          content:
            application/json:
              schema:
                type: object
                properties:
                  demarches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Demarche"

  /demarches/{id}:
    get:
      tags: [Démarches]
      summary: Détail d'une démarche
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "inscription-universite"
      responses:
        "200":
          description: Détail de la démarche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demarche"
        "404":
          description: Démarche non trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ─── Types de pièces ───
  /types-pieces:
    get:
      tags: [Types de pièces]
      summary: Lister tous les types de pièces
      responses:
        "200":
          description: Catalogue des types de pièces
          content:
            application/json:
              schema:
                type: object
                properties:
                  types_pieces:
                    type: array
                    items:
                      $ref: "#/components/schemas/TypePiece"

  /types-pieces/{id}/prerequis:
    get:
      tags: [Types de pièces]
      summary: Arbre de prérequis d'un type de pièce
      description: |
        Retourne l'arbre complet des dépendances pour obtenir cette pièce.
        Utilisé pour la résolution en cascade.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "casier-judiciaire"
      responses:
        "200":
          description: Arbre de prérequis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbrePrerequis"
        "404":
          description: "TYPE_PIECE_INCONNU : type de pièce absent du catalogue"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ─── Requêtes de données ───
  /requetes:
    post:
      tags: [Requêtes]
      summary: Soumettre une requête de données
      description: |
        Une administration (publique ou privée) demande des données sur un citoyen
        pour une démarche donnée. La passerelle :
        1. Vérifie les droits (mission, type d'admin)
        2. Résout les dépendances en cascade si nécessaire
        3. Applique le filtre de minimisation
        4. Crée une demande de consentement si admin privée
        5. Retourne les données filtrées (ou un statut "en_attente_consentement")
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequeteEntree"
      responses:
        "200":
          description: Données retournées (admin publique, accès direct)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequeteResultat"
        "202":
          description: "En attente : consentement du citoyen (admin privée, statut en_attente_consentement) ou registre hors service (statut en_attente_registre, la requête est conservée et reprise à la consultation suivante)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequeteEnAttente"
        "400":
          description: Corps invalide (iue_citoyen ou demarche_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: Jeton d'administration absent ou invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "403":
          description: Accès refusé (HORS_MISSION, ou ADMINISTRATION_INCONNUE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: Démarche inconnue (DEMARCHE_INCONNUE) ou citoyen inconnu (CITOYEN_NON_TROUVE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "502":
          description: |
            Un service (registre, consentement, journal) est injoignable. Aucune donnée
            n'est transmise sans entrée au journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /requetes/{id}:
    get:
      tags: [Requêtes]
      summary: Consulter le statut d'une requête
      description: |
        Permet à l'administration de vérifier si le consentement a été donné.

        Remise unique : la passerelle ne garde aucune copie des données transmises.
        Pour une administration privée, les données sont lues dans les registres et
        remises par la première consultation qui suit l'acceptation du citoyen ; les
        consultations suivantes renvoient `statut = complete` avec `donnees = null`.
        Pour une administration publique, les données ont été remises dans la réponse
        200 de POST /requetes. L'administration conserve ce qu'elle a reçu ; pour
        l'obtenir de nouveau, elle soumet une nouvelle requête.

        Registre hors service : la requête est « en_attente_registre ». Chaque consultation
        la reprend là où elle s'était arrêtée (vérification du citoyen, demande de
        consentement, ou lecture et remise) ; dès que les registres sont revenus, la
        consultation remet les données, sans nouvelle demande. Rien n'est lu ni gardé
        pendant l'attente. « echouee » : le citoyen s'est révélé inconnu à la reprise.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Statut de la requête
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequeteStatut"
        "401":
          description: "Jeton d'administration absent ou invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: Requête inconnue ou appartenant à une autre administration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /requetes/{id}/telephone:
    get:
      tags: [Requêtes]
      summary: Obtenir le téléphone du citoyen pour relance
      description: |
        Retourne le numéro de téléphone du citoyen concerné par la requête.
        Utilisable par l'administration pour relancer le citoyen si le consentement tarde.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Numéro de téléphone
          content:
            application/json:
              schema:
                type: object
                properties:
                  telephone:
                    type: string
                    example: "+226 70 12 34 56"
        "400":
          description: La requête n'est plus en attente de consentement (RELANCE_IMPOSSIBLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "Jeton d'administration absent ou invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: Requête inconnue, ou citoyen sans téléphone enregistré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "503":
          description: Espace usager (qui détient le téléphone) injoignable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ─── Administrations ───
  /administrations:
    get:
      tags: [Démarches]
      summary: Lister les administrations de la plateforme
      description: Utilisé par l'interface de test du BFF (choix de l'administration simulée).
      responses:
        "200":
          description: Liste des administrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  administrations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        nom:
                          type: string
                          example: "Université Joseph KI-ZERBO"
                        type:
                          type: string
                          enum: [publique, privee]
                        domaine_mission:
                          type: string
                          example: "education"

  # ─── Registres et dictionnaire ───
  /registres:
    get:
      tags: [Registres]
      summary: État des registres branchés
      description: |
        Registres déclarés dans le catalogue, leur état (actif ou suspendu), leur
        disponibilité (sondée toutes les 5 s) et les opérations qu'ils servent. Les adresses
        des registres ne sont pas exposées. Route publique : aucune donnée personnelle.
      responses:
        "200":
          description: État des registres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EtatRegistres"

  /dictionnaire:
    get:
      tags: [Registres]
      summary: Dictionnaire des données
      description: |
        Données de la plateforme par domaine, avec leur libellé (affiché au citoyen dans
        son journal), leur type, leur sensibilité et l'opération qui les fournit. Une donnée
        « calculee » est dérivée par la passerelle (ex : est_majeur à partir de la date de
        naissance, qui ne sort jamais). Route publique.
      responses:
        "200":
          description: Dictionnaire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dictionnaire"

  # ─── Interne (réservé au BFF espace usager) ───
  /interne/citoyens/{iue}:
    get:
      tags: [Interne]
      summary: Identité d'un citoyen et de ses enfants (BFF uniquement)
      description: |
        Protégé par la clé de service partagée (en-tête X-Cle-Service). Le BFF n'interroge
        jamais les registres directement ; il lit ici nom, prénom, date de naissance et
        enfants pour l'espace personnel du citoyen. Non inscrit au journal : aucune
        administration n'accède aux données.
      parameters:
        - name: iue
          in: path
          required: true
          schema:
            type: string
        - name: X-Cle-Service
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Identité
          content:
            application/json:
              schema:
                type: object
                properties:
                  iue:
                    type: string
                  nom:
                    type: string
                  prenom:
                    type: string
                  date_naissance:
                    type: string
                    format: date
                  est_majeur:
                    type: boolean
                  enfants:
                    type: array
                    items:
                      type: object
                      properties:
                        iue:
                          type: string
                        nom:
                          type: string
                        prenom:
                          type: string
                        date_naissance:
                          type: string
                          format: date
                        est_majeur:
                          type: boolean
        "401":
          description: Clé de service absente ou invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: CITOYEN_NON_TROUVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "503":
          description: "REGISTRE_INDISPONIBLE : l'état civil est hors service ; le BFF affiche alors l'espace sans les noms"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /interne/citoyens/{iue}/pieces/{type_piece_id}:
    get:
      tags: [Interne]
      summary: Contenu d'une pièce d'un citoyen (BFF uniquement)
      description: |
        Protégé par la clé de service partagée (en-tête X-Cle-Service). Appelé par le BFF
        pour GET /api/demandes/{id}/contenu, après son contrôle d'accès.

        La pièce est lue dans le registre qui la détient, uniquement par les routes des
        contrats des registres : le registre d'une autre équipe fonctionne. Le registre est
        relu à chaque appel, sans copie stockée : une pièce évolutive (casier, situation
        fiscale) est toujours à jour.

        Ni minimisation ni journal : le citoyen (ou son tuteur) consulte ses propres
        données, aucune administration n'y accède. La passerelle ne garde que les champs
        des contrats, même si un registre ignore le paramètre facultatif `champs`.

        | Pièce | Route du registre lue |
        |-------|-----------------------|
        | `extrait-naissance` | état-civil `GET /citoyens/{iue}` (+ nom des parents) |
        | `certificat-nationalite` | justice `GET /citoyens/{iue}/nationalite` |
        | `casier-judiciaire` | justice `GET /citoyens/{iue}/casier` |
        | `attestation-fiscale` | fiscal `GET /citoyens/{iue}/fiscal` |

        `titulaire` est toujours lu à l'état civil (`GET /citoyens/{iue}?champs=iue,nom,prenom`).
      parameters:
        - name: iue
          in: path
          required: true
          description: Titulaire de la pièce (le citoyen ou son enfant)
          schema:
            type: string
          example: "784302956148"
        - name: type_piece_id
          in: path
          required: true
          description: "Identifiant du catalogue : extrait-naissance, certificat-nationalite, casier-judiciaire ou attestation-fiscale"
          schema:
            type: string
          example: "casier-judiciaire"
        - name: X-Cle-Service
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contenu de la pièce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContenuPiece"
              examples:
                casier-judiciaire:
                  summary: Casier judiciaire d'Amadou
                  value:
                    type_piece:
                      id: "casier-judiciaire"
                      nom: "Casier judiciaire"
                      registre_source: "justice"
                      est_evolutive: true
                    titulaire:
                      iue: "784302956148"
                      nom: "OUEDRAOGO"
                      prenom: "Amadou"
                    donnees:
                      casier_vierge: true
                      condamnations: []
                      date_delivrance: "2026-11-17"
                extrait-naissance:
                  summary: Extrait de naissance d'Amadou (parents identifiés)
                  value:
                    type_piece:
                      id: "extrait-naissance"
                      nom: "Extrait de naissance"
                      registre_source: "etat-civil"
                      est_evolutive: false
                    titulaire:
                      iue: "784302956148"
                      nom: "OUEDRAOGO"
                      prenom: "Amadou"
                    donnees:
                      nom: "OUEDRAOGO"
                      prenom: "Amadou"
                      date_naissance: "1998-03-15"
                      lieu_naissance: "Ouagadougou"
                      sexe: "M"
                      nationalite: "Burkinabè"
                      pere:
                        iue: "291047583620"
                        nom: "OUEDRAOGO"
                        prenom: "Ibrahim"
                      mere:
                        iue: "638501274093"
                        nom: "SAWADOGO"
                        prenom: "Fatimata"
                      date_deces: null
                      est_majeur: true
        "401":
          description: "CLE_SERVICE_INVALIDE : clé de service absente ou invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: |
            TYPE_PIECE_INCONNU, ou PIECE_INDISPONIBLE : la pièce ou son titulaire est absent du
            registre (IUE mal formé compris, comme pour /interne/citoyens/{iue}). Le BFF
            présente ce cas au citoyen comme une pièce pas encore disponible en ligne.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "502":
          description: "SERVICE_EN_ERREUR : un registre répond autrement que le catalogue ne le décrit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "503":
          description: "REGISTRE_INDISPONIBLE : le registre de la pièce (ou l'état civil) est hors service"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /interne/cascade:
    post:
      tags: [Interne]
      summary: Résoudre la cascade d'une pièce demandée par un citoyen (BFF uniquement)
      description: Protégé par la clé de service partagée (en-tête X-Cle-Service).
      parameters:
        - name: X-Cle-Service
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type_piece_id, iue]
              properties:
                type_piece_id:
                  type: string
                  example: "casier-judiciaire"
                iue:
                  type: string
                  description: Titulaire de la pièce (le citoyen ou son enfant)
      responses:
        "200":
          description: Arbre de résolution
          content:
            application/json:
              schema:
                type: object
                properties:
                  type_piece:
                    type: object
                    properties:
                      id:
                        type: string
                      nom:
                        type: string
                  statut:
                    type: string
                    enum: [complete, fallback_physique, en_attente_registre]
                    description: "en_attente_registre : un registre nécessaire est hors service ; le BFF relance la demande jusqu'à son retour"
                  registres_indisponibles:
                    type: array
                    items:
                      type: string
                    description: Registres hors service (seulement si statut = en_attente_registre)
                  cascade:
                    type: array
                    items:
                      type: object
                      properties:
                        type_piece:
                          type: string
                        proprietaire:
                          type: string
                          enum: [citoyen, pere, mere]
                        registre_source:
                          type: string
                        statut:
                          type: string
                          enum: [resolu, manquant_fallback_physique, en_attente_registre]
                        sous_prerequis:
                          type: array
                          items:
                            type: object
        "400":
          description: "DONNEES_INVALIDES : iue ou type_piece_id invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "CLE_SERVICE_INVALIDE : clé de service absente ou invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: TYPE_PIECE_INCONNU ou CITOYEN_NON_TROUVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton d'ADMINISTRATION, signé en HS256 avec le secret partagé JWT_SECRET.
        Contenu : { "administration_id": "<uuid>" }. Jetons de démo :
        `docker compose exec passerelle npm run jeton:admin`.

  schemas:
    Demarche:
      type: object
      properties:
        id:
          type: string
          example: "inscription-universite"
        nom:
          type: string
          example: "Inscription universitaire"
        description:
          type: string
          example: "Inscription dans un établissement d'enseignement supérieur"
        administration_cible:
          type: string
          example: "Université Joseph KI-ZERBO"
        champs_requis:
          type: array
          description: Champs nécessaires par registre pour cette démarche
          items:
            type: object
            properties:
              registre:
                type: string
                enum: [etat-civil, justice, fiscal]
                example: "etat-civil"
              champs:
                type: array
                items:
                  type: string
                example: ["est_majeur", "nationalite"]
        prerequis_pieces:
          type: array
          description: Types de pièces prérequises pour cette démarche
          items:
            type: string
            example: "certificat-nationalite"

    TypePiece:
      type: object
      properties:
        id:
          type: string
          example: "casier-judiciaire"
        nom:
          type: string
          example: "Casier judiciaire"
        registre_source:
          type: string
          enum: [etat-civil, justice, fiscal]
          example: "justice"
        est_evolutive:
          type: boolean
          description: La pièce peut changer dans le temps (casier, situation fiscale)
          example: true
        demarche_si_absente:
          type: string
          nullable: true
          description: "Démarche à suivre quand la pièce n'est pas encore dans le registre numérique (donnée numérique manquante). Texte neutre, valable aussi pour la pièce d'un parent ; null si aucune n'est connue."
          example: "S'adresser au greffe du tribunal de grande instance du lieu de naissance de la personne concernée."

    IdentiteMinimale:
      type: object
      description: Identité réduite au strict nécessaire (titulaire d'une pièce, parents d'un extrait de naissance)
      properties:
        iue:
          type: string
          example: "784302956148"
        nom:
          type: string
          example: "OUEDRAOGO"
        prenom:
          type: string
          example: "Amadou"

    ContenuPiece:
      type: object
      description: Contenu d'une pièce, lu dans son registre au moment de l'appel (aucune copie stockée)
      properties:
        type_piece:
          $ref: "#/components/schemas/TypePiece"
        titulaire:
          $ref: "#/components/schemas/IdentiteMinimale"
        donnees:
          type: object
          additionalProperties: true
          description: |
            Champs du schéma du registre qui détient la pièce, sans `iue` (déjà dans `titulaire`) :
            - extrait-naissance : DonneesEtatCivil (registre état-civil), où `pere` et `mere`
              (IdentiteMinimale, ou null si le parent est inconnu de l'état civil) remplacent
              `pere_iue` et `mere_iue` ;
            - certificat-nationalite : CertificatNationalite (registre justice) ;
            - casier-judiciaire : CasierJudiciaire (registre justice) ;
            - attestation-fiscale : SituationFiscale (registre fiscal).

    ArbrePrerequis:
      type: object
      properties:
        type_piece:
          type: string
          example: "casier-judiciaire"
        prerequis:
          type: array
          items:
            type: object
            properties:
              type_piece:
                type: string
                example: "certificat-nationalite"
              proprietaire:
                type: string
                enum: [citoyen, pere, mere]
                example: "citoyen"
              prerequis:
                type: array
                description: Sous-prérequis (récursif)
                items:
                  type: object
                  properties:
                    type_piece:
                      type: string
                      example: "extrait-naissance"
                    proprietaire:
                      type: string
                      example: "pere"
                    prerequis:
                      type: array
                      items: {}

    RequeteEntree:
      type: object
      required: [iue_citoyen, demarche_id]
      properties:
        iue_citoyen:
          type: string
          example: "784302956148"
        demarche_id:
          type: string
          example: "inscription-universite"

    RequeteResultat:
      type: object
      properties:
        requete_id:
          type: string
          format: uuid
        statut:
          type: string
          enum: [complete]
        donnees:
          type: object
          description: Données filtrées selon la démarche, regroupées par registre
          example:
            etat-civil:
              est_majeur: true
              nationalite: "Burkinabè"
            justice:
              casier_vierge: true
        cascade:
          type: array
          description: Résolutions de dépendances effectuées automatiquement
          items:
            type: object
            properties:
              type_piece:
                type: string
              proprietaire:
                type: string
              registre_source:
                type: string
              statut:
                type: string
                enum: [resolu, manquant_fallback_physique]
        journal_id:
          type: string
          format: uuid
          description: Identifiant de l'entrée créée dans le journal de traçabilité.

    RequeteEnAttente:
      type: object
      properties:
        requete_id:
          type: string
          format: uuid
        statut:
          type: string
          enum: [en_attente_consentement, en_attente_registre]
        consentement_id:
          type: string
          format: uuid
          description: Présent seulement si statut = en_attente_consentement
        registres_indisponibles:
          type: array
          items:
            type: string
          description: "Présent seulement si statut = en_attente_registre : registres hors service attendus"
        message:
          type: string
          example: "En attente du consentement du citoyen. Notification envoyée."

    RequeteStatut:
      type: object
      properties:
        requete_id:
          type: string
          format: uuid
        statut:
          type: string
          enum: [en_attente_consentement, consentement_accepte, consentement_refuse, expire, complete, en_attente_registre, echouee]
        donnees:
          type: object
          nullable: true
          description: "Rempli uniquement dans la réponse qui remet les données (première consultation après l'acceptation ou après le retour d'un registre) ; null ensuite, la passerelle n'en garde pas de copie"
        registres_indisponibles:
          type: array
          items:
            type: string
          description: Présent seulement si statut = en_attente_registre
        date_creation:
          type: string
          format: date-time
        date_expiration:
          type: string
          format: date-time
          nullable: true
          description: Expiration du consentement (null pour une requête publique)
        date_reponse:
          type: string
          format: date-time
          nullable: true

    EtatRegistres:
      type: object
      properties:
        registres:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "justice"
              nom:
                type: string
                example: "Registre de la justice (MESSAF)"
              proprietaire:
                type: string
                nullable: true
              etat:
                type: string
                enum: [actif, suspendu]
              disponibilite:
                type: string
                enum: [disponible, hors_service]
              depuis:
                type: string
                format: date-time
                description: Depuis quand le registre est dans cette disponibilité
              derniere_verification:
                type: string
                format: date-time
                nullable: true
              identification:
                type: string
                enum: [iue, recherche]
              operations:
                type: array
                items:
                  type: string
                example: ["justice.casier", "justice.nationalite"]
        sources:
          type: object
          description: "Pour chaque opération, les registres qui la servent : le premier fait foi, les suivants sont des sources de secours"
          additionalProperties:
            type: array
            items:
              type: string

    Dictionnaire:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        domaines:
          type: object
          description: "Domaine, puis donnée"
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              properties:
                libelle:
                  type: string
                  example: "Majeur"
                type:
                  type: string
                  enum: [texte, date, booleen, nombre, identifiant, liste]
                sensibilite:
                  type: string
                  enum: [publique, personnelle, sensible]
                operation:
                  type: string
                  example: "etat-civil.fiche"
                calculee:
                  type: boolean

    Erreur:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
