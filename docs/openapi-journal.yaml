openapi: 3.0.3
info:
  title: Journal de Traçabilité API
  description: |
    API du journal de traçabilité.
    Enregistre et expose tous les accès aux données des citoyens.
    Double traçabilité : titulaire (propriétaire des données) + décideur (qui a autorisé).
  version: 1.0.0

servers:
  - url: http://localhost:3006/api
    description: Service journal (dev)

tags:
  - name: Journal citoyen
    description: Consultation du journal par le citoyen
  - name: Journal interne
    description: Enregistrement des accès (interne)

paths:
  # ─── Consultation par le citoyen ───
  /journal:
    get:
      tags: [Journal citoyen]
      summary: Consulter son journal d'accès
      description: |
        Le citoyen voit tous les accès à ses données.
        Inclut les accès aux données de ses enfants (tuteur) : le jeton émis par le
        BFF contient la liste `enfants` des IUE des mineurs dont il est tuteur.
      security:
        - BearerAuth: []
      parameters:
        - name: date_debut
          in: query
          schema:
            type: string
            format: date
          description: Filtrer à partir de cette date
        - name: date_fin
          in: query
          schema:
            type: string
            format: date
          description: Filtrer jusqu'à cette date
        - name: administration
          in: query
          schema:
            type: string
          description: Filtrer par nom d'administration
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limite
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Entrées du journal
          content:
            application/json:
              schema:
                type: object
                properties:
                  entrees:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntreeJournal"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: "DONNEES_INVALIDES : dates, page ou limite invalides"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: "Jeton citoyen absent ou invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /journal/statistiques:
    get:
      tags: [Journal citoyen]
      summary: Statistiques d'accès
      description: Résumé des accès aux données du citoyen (pour le tableau de bord).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_acces:
                    type: integer
                    example: 15
                  acces_30_derniers_jours:
                    type: integer
                    example: 3
                  par_administration:
                    type: array
                    items:
                      type: object
                      properties:
                        administration:
                          type: string
                          example: "Université Joseph KI-ZERBO"
                        nombre_acces:
                          type: integer
                          example: 2
        "401":
          description: "Jeton citoyen absent ou invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  /journal/verification:
    get:
      tags: [Journal citoyen]
      summary: Vérifier l'intégrité du journal
      description: |
        Recalcule la chaîne des empreintes de tout le journal. Chaque entrée porte son rang,
        l'empreinte SHA-256 de l'entrée précédente et la sienne (contenu, rang et empreinte
        précédente) : une entrée modifiée ou supprimée, même directement en base, rompt la
        chaîne. La réponse ne contient aucune donnée d'un autre citoyen (seulement le rang et
        la cause de la première rupture).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Résultat de la vérification (intègre ou non)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJournal"
        "401":
          description: "Jeton citoyen absent ou invalide"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

  # ─── Enregistrement interne ───
  /journal/enregistrer:
    post:
      tags: [Journal interne]
      summary: Enregistrer un accès (interne)
      description: |
        Appelé automatiquement par la passerelle à chaque transmission de données.
        Enregistre : qui a accédé, à quelles données, pour quel citoyen, pourquoi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NouvelAcces"
      responses:
        "201":
          description: Accès enregistré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntreeJournal"
        "400":
          description: "DONNEES_INVALIDES : entrée de journal incomplète ou mal formée"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EntreeJournal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        titulaire_iue:
          type: string
          description: IUE du propriétaire des données consultées
          example: "784302956148"
        decideur_iue:
          type: string
          description: |
            IUE de la personne qui a autorisé l'accès.
            Identique au titulaire sauf pour les mineurs (c'est le tuteur).
          example: "291047583620"
        administration:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nom:
              type: string
              example: "Université Joseph KI-ZERBO"
            type:
              type: string
              enum: [publique, privee]
        demarche:
          type: string
          example: "Inscription universitaire"
        registres_consultes:
          type: array
          items:
            type: string
            enum: [etat-civil, justice, fiscal]
          example: ["etat-civil"]
        champs_transmis:
          type: array
          items:
            type: string
          example: ["est_majeur", "nationalite"]
        type_acces:
          type: string
          enum: [direct, consentement]
          description: |
            direct = admin publique (accès sans consentement explicite)
            consentement = admin privée (consentement explicite du citoyen)
        base_legale:
          $ref: "#/components/schemas/BaseLegale"
        date_acces:
          type: string
          format: date-time

    NouvelAcces:
      type: object
      required:
        - titulaire_iue
        - decideur_iue
        - administration_id
        - demarche_id
        - registres_consultes
        - champs_transmis
        - type_acces
      properties:
        titulaire_iue:
          type: string
        decideur_iue:
          type: string
        administration_id:
          type: string
          format: uuid
        demarche_id:
          type: string
        requete_id:
          type: string
          format: uuid
        registres_consultes:
          type: array
          items:
            type: string
        champs_transmis:
          type: array
          items:
            type: string
        type_acces:
          type: string
          enum: [direct, consentement]
        base_legale:
          $ref: "#/components/schemas/BaseLegale"
        administration_nom:
          type: string
          description: |
            Facultatif. Nom de l'administration au moment de l'accès (photo figée,
            renvoyée telle quelle dans EntreeJournal.administration.nom).
          example: "Université Joseph KI-ZERBO"
        administration_type:
          type: string
          enum: [publique, privee]
          description: Facultatif. Type de l'administration au moment de l'accès.
        demarche_nom:
          type: string
          description: |
            Facultatif. Nom lisible de la démarche (renvoyé dans EntreeJournal.demarche).
            À défaut, le journal affiche demarche_id.
          example: "Inscription universitaire"

    VerificationJournal:
      type: object
      description: "Intégrité du journal : chaîne des empreintes recalculée"
      properties:
        integre:
          type: boolean
          description: "Vrai si aucune entrée n'a été modifiée, supprimée ou ajoutée hors de l'API"
          example: true
        entrees_verifiees:
          type: integer
          description: Nombre d'entrées de toute la chaîne recalculées
          example: 128
        entrees_hors_chaine:
          type: integer
          description: "Entrées sans empreinte (ajoutées hors de l'API) : 0 attendu"
          example: 0
        vos_entrees:
          type: integer
          description: Entrées de la chaîne visibles par le citoyen connecté (lui et ses enfants)
          example: 4
        derniere_empreinte:
          type: string
          description: "Empreinte SHA-256 de la dernière entrée : la conserver ailleurs (ancre) permet de détecter une réécriture de toute la fin de la chaîne"
          example: "9f2c4e7a1b0d3c5e8f6a2b4d1c3e5f7a9b0c2d4e6f8a1b3c5d7e9f0a2b4c6d8e"
        rupture:
          type: object
          nullable: true
          description: Première rupture de la chaîne, ou null
          properties:
            rang:
              type: integer
              example: 1
            cause:
              type: string
              enum: [contenu_modifie, entree_supprimee, chainage_rompu]
            concerne_vos_donnees:
              type: boolean
              nullable: true
              description: "Vrai si l'entrée en cause est visible par le citoyen ; null pour une entrée supprimée"
        date_verification:
          type: string
          format: date-time

    BaseLegale:
      type: object
      nullable: true
      description: "Base légale de la démarche : en vertu de quoi les données sont traitées. Qualification à valider par un juriste ou la CIL ; texte et référence CIL fournis par l'administration. Null pour une entrée antérieure à son introduction."
      properties:
        fondement:
          type: string
          enum: [mission_service_public, obligation_legale, execution_contrat, consentement]
        libelle:
          type: string
          description: "Libellé du fondement (ignoré en entrée)"
          example: "Mission de service public"
        finalite:
          type: string
          example: "Vérifier les conditions d'inscription dans l'enseignement supérieur (majorité, nationalité)"
        texte:
          type: string
          nullable: true
          description: Texte qui autorise la démarche
          example: "À préciser par l'administration"
        reference_cil:
          type: string
          nullable: true
          description: Référence de la formalité auprès de la CIL
          example: "À renseigner (formalité auprès de la CIL)"

    Erreur:
      type: object
      description: Format uniforme des erreurs de la plateforme
      properties:
        code:
          type: string
          example: "DONNEES_INVALIDES"
        message:
          type: string
          example: "titulaire_iue doit contenir 12 chiffres"

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limite:
          type: integer
        total:
          type: integer
        pages:
          type: integer
